<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carta de San Valentín</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="card">
        <h1 class="title">Estrellita de Mar, ¿me acompañas el 14 de febrero?</h1>
        <p class="message">Lamento mucho lo sucedido antes, pero quiero mejorar. Prometo siempre intentarlo contigo. 💖</p>
        <div class="buttons">
            <button id="noBtn" class="btn no">No acepto</button>
            <button id="yesBtn" class="btn yes">Sí, acepto</button>
        </div>
    </div>

    <!-- Ventana emergente de confirmación -->
    <div id="confirmationPopup" class="popup">
        <div class="popup-content">
            <p>¿Estás segura? No hay vuelta atrás...</p>
            <button id="finalYesBtn" class="btn">Sí, acepto</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
