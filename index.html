<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Carta de San Valentín</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="heart">💖</div>
            <div class="message">
                <h1>¡Feliz San Valentín!</h1>
                <p>¿Aceptas mi amor?</p>
            </div>
            <div class="buttons">
                <button class="accept-btn" id="accept-btn">Sí, acepto</button>
                <button class="reject-btn" id="reject-btn">No acepto</button>
            </div>
        </div>
    </div>

    <!-- Ventana emergente -->
    <div class="popup" id="popup">
        <div class="popup-content">
            <p>¿Estás segura? No hay vuelta atrás... ¿Aceptas?</p>
            <button id="confirm-btn">Sí, acepto</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
